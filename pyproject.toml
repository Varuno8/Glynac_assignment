[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "glynac-wealth-advisor"
version = "0.2.0"
description = "A reproducible multi-agent wealth advisory assignment"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.12,<3", "rich>=13,<15", "python-dotenv>=1,<2"]

[project.optional-dependencies]
openai = ["openai>=2,<3"]
dev = ["openai>=2,<3", "pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
wealth-advisor = "src.main:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
